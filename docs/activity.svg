<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#536d86"/></marker></defs><rect width="1000" height="1080" fill="#f5f8fc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="bold" fill="#17324d">Activity · Обработка заказа доставки</text><g stroke="#536d86" stroke-width="3" fill="none" marker-end="url(#arr)"><path d="M500 110V150M500 215V255M500 320V360M500 425V465M500 530V570M500 635V675M500 740V780M500 845V885M500 950V990"/></g><g font-family="Arial" text-anchor="middle" fill="#17324d"><circle cx="500" cy="95" r="14" fill="#17324d"/><g fill="#eaf3fc" stroke="#377bb1" stroke-width="3"><rect x="300" y="150" width="400" height="65" rx="22"/><rect x="300" y="255" width="400" height="65" rx="22"/><rect x="300" y="360" width="400" height="65" rx="22"/><rect x="300" y="465" width="400" height="65" rx="22"/><rect x="300" y="570" width="400" height="65" rx="22"/><rect x="300" y="675" width="400" height="65" rx="22"/><rect x="300" y="780" width="400" height="65" rx="22"/><rect x="300" y="885" width="400" height="65" rx="22"/><rect x="300" y="990" width="400" height="65" rx="22"/></g><g font-size="18"><text x="500" y="190">Клиент и адреса отправителя / получателя</text><text x="500" y="295">Выбрать услугу, указать расстояние и груз</text><text x="500" y="400">Рассчитать стоимость и зарегистрировать заказ</text><text x="500" y="505">Подтвердить заказ и назначить курьера</text><text x="500" y="610">Добавить заказ в маршрут и сформировать остановку</text><text x="500" y="715">Курьер забирает и доставляет отправление</text><text x="500" y="820">Система записывает историю каждого статуса</text><text x="500" y="925">Получить оплату и закрыть заказ</text><text x="500" y="1030">Показать клиенту результат; включить данные в отчеты</text></g><circle cx="500" cy="1060" r="14" fill="#17324d"/></g></svg>
